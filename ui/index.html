<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K.I.T.E — Control Interface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&family=Outfit:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --hud-cyan: rgba(0, 229, 255, 0.8);
      --hud-cyan-dim: rgba(0, 229, 255, 0.15);
      --hud-cyan-glow: rgba(0, 229, 255, 0.4);
      --hud-red: #ff3d00;
      --hud-text: hsl(220, 8%, 58%);
      --hud-text-dim: hsl(220, 6%, 32%);
      --hud-border: rgba(0, 229, 255, 0.08);
      --bg: #000;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      background-image:
        linear-gradient(rgba(0,229,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.015) 1px, transparent 1px);
      background-size: 60px 60px;
      font-family: 'Outfit', 'Inter', sans-serif;
      color: var(--hud-text);
      height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
    }

    /* ── Noise texture overlay ── */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 300; pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
    }

    /* ── Corner brackets (targeting reticle) ── */
    .corner-bracket { position: fixed; width: 28px; height: 28px; z-index: 150; pointer-events: none; border-color: var(--hud-cyan-dim); border-style: solid; border-width: 0; }
    .corner-bracket.tl { top: 16px; left: 16px; border-top-width: 1px; border-left-width: 1px; }
    .corner-bracket.tr { top: 16px; right: 16px; border-top-width: 1px; border-right-width: 1px; }
    .corner-bracket.bl { bottom: 16px; left: 16px; border-bottom-width: 1px; border-left-width: 1px; }
    .corner-bracket.br { bottom: 16px; right: 16px; border-bottom-width: 1px; border-right-width: 1px; }

    /* ── CLASSIFIED watermark ── */
    .watermark {
      position: fixed; inset: 0; z-index: 140; pointer-events: none;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Outfit', sans-serif; font-size: 10vw; font-weight: 600;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(0, 229, 255, 0.012);
      transform: rotate(-30deg); white-space: nowrap;
    }

    /* ── System clock ── */
    .system-clock {
      position: fixed; bottom: 18px; right: 20px; z-index: 160;
      font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 300;
      letter-spacing: 0.15em; color: var(--hud-text-dim);
      opacity: 0; transition: opacity 0.6s ease;
    }
    .system-clock.visible { opacity: 1; }
    .system-clock .clock-label { color: rgba(0,229,255,0.25); margin-right: 6px; }

    /* ── Start overlay ── */
    .start-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.96);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    .start-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .start-overlay .prompt-ring {
      width: 100px; height: 100px; border-radius: 0;
      border: 1px solid var(--hud-cyan-dim);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 32px; position: relative;
      animation: pulseRing 4s ease-in-out infinite;
    }
    .start-overlay .prompt-ring::before {
      content: ''; position: absolute; inset: -10px;
      border: 1px solid rgba(0,229,255,0.04);
      animation: pulseRing 4s ease-in-out infinite 0.5s;
    }
    .start-overlay .prompt-ring::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,229,255,0.03) 0%, transparent 60%);
    }

    .start-overlay .prompt-icon {
      font-size: 28px; color: var(--hud-cyan);
      animation: glitchIcon 6s steps(1) infinite;
      text-shadow: 0 0 12px var(--hud-cyan-glow);
    }

    .start-overlay .prompt-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; font-weight: 400;
      letter-spacing: 4px; text-transform: uppercase;
      color: var(--hud-text);
      animation: fadeIn 1s ease 0.5s forwards; opacity: 0;
    }
    .start-overlay .prompt-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px; color: var(--hud-text-dim);
      margin-top: 10px; letter-spacing: 1.5px; text-transform: uppercase;
      animation: fadeIn 1s ease 1.2s forwards; opacity: 0;
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes glitchIcon {
      0%, 92%, 100% { opacity: 1; transform: translate(0); }
      93% { opacity: 0.6; transform: translate(-2px, 1px); }
      94% { opacity: 1; transform: translate(1px, -1px); }
      95% { opacity: 0.4; transform: translate(0); }
      96% { opacity: 1; transform: translate(2px, 0); }
      97% { opacity: 0.7; transform: translate(-1px, 1px); }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ── Scan-line overlay on start screen ── */
    .start-overlay::before {
      content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,229,255,0.008) 2px, rgba(0,229,255,0.008) 4px);
    }

    /* ── Animation iframe ── */
    .animation-frame { flex: 1; position: relative; overflow: hidden; }
    .animation-frame iframe { width: 100%; height: 100%; border: none; display: block; }

    /* Vignette + scan-lines over the logo */
    .animation-frame::after {
      content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 6px),
        radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.4) 70%, rgba(0,0,0,0.85) 100%);
    }

    /* ── Connection status HUD ── */
    .connection-status {
      position: fixed; top: 18px; right: 54px; z-index: 160;
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; border-radius: 0;
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--hud-border);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; font-weight: 400;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--hud-text-dim);
      opacity: 0; transition: opacity 0.6s ease;
    }
    .connection-status.visible { opacity: 1; }

    .status-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--hud-text-dim);
      transition: background 0.6s ease, box-shadow 0.6s ease;
    }
    .status-dot.connected {
      background: var(--hud-cyan);
      box-shadow: 0 0 6px var(--hud-cyan-glow);
    }
    .status-dot.error {
      background: var(--hud-red);
      box-shadow: 0 0 6px rgba(255,61,0,0.5);
    }

    /* ── Message panels — terminal readout ── */
    .message-panels {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(20px);
      z-index: 50; width: 90%; max-width: 860px;
      display: flex; flex-direction: column; gap: 0;
      opacity: 0; transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .message-panels.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    .message-panel {
      padding: 14px 22px;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--hud-border);
      border-bottom: none; min-height: 64px; max-height: 100px;
      overflow-y: auto; position: relative;
    }
    .message-panel:first-child { border-bottom: none; }
    .message-panel:last-child { border-bottom: 1px solid var(--hud-border); margin-bottom: 14px; }

    .message-panel::-webkit-scrollbar { width: 2px; }
    .message-panel::-webkit-scrollbar-track { background: transparent; }
    .message-panel::-webkit-scrollbar-thumb { background: var(--hud-cyan-dim); border-radius: 0; }

    .panel-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px; font-weight: 400;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--hud-text-dim); margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .panel-label .icon { font-size: 8px; opacity: 0.4; color: var(--hud-cyan); }
    .panel-label.user-label .accent { color: rgba(0,229,255,0.4); }
    .panel-label.agent-label .accent { color: rgba(0,229,255,0.3); }

    .message-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; font-weight: 300; line-height: 1.7;
      color: var(--hud-text); white-space: pre-wrap; word-break: break-word;
      transition: color 0.4s ease, text-shadow 0.4s ease;
    }
    .message-text.fresh { color: rgba(0,229,255,0.9); text-shadow: 0 0 8px var(--hud-cyan-glow); }
    .message-text.user-text.fresh { color: rgba(0,229,255,0.85); }
    .message-text.agent-text.fresh { color: rgba(200,230,255,0.9); }
    .message-text.empty { color: var(--hud-text-dim); font-style: normal; }

    .typing-cursor {
      display: inline-block; width: 2px; height: 12px;
      background: var(--hud-cyan); margin-left: 3px;
      vertical-align: text-bottom; animation: cursorBlink 1s steps(1) infinite;
    }
    @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* ── Debug audio input ── */
    .debug-audio {
      position: fixed; top: 18px; left: 54px; z-index: 160;
      display: flex; align-items: center; gap: 10px;
      padding: 6px 14px; border-radius: 0;
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--hud-border);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; font-weight: 400; color: var(--hud-text-dim);
      opacity: 0; transition: opacity 0.6s ease;
    }
    .debug-audio.visible { opacity: 1; }
    .debug-audio label {
      cursor: pointer; padding: 3px 10px; border-radius: 0;
      background: rgba(0,229,255,0.04);
      border: 1px solid var(--hud-cyan-dim);
      transition: background 0.2s, border-color 0.2s;
      font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--hud-text);
    }
    .debug-audio label:hover { background: rgba(0,229,255,0.08); border-color: var(--hud-cyan-glow); }
    .debug-audio input[type="file"] { display: none; }
    .debug-audio .debug-status { font-size: 9px; color: var(--hud-text-dim); }

    /* ── Input Visualizer (from kite_input.html) ── */
    .ki-section {
      position: relative; z-index: 60;
      display: flex; flex-direction: column; align-items: center;
      gap: 16px; padding: 14px 5vw 10px;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .ki-section.visible { opacity: 1; transform: translateY(0); }

    .ki-wrapper { position: relative; width: clamp(300px, 70vw, 540px); }
    .ki-glow-ring {
      position: absolute; inset: -1px; border-radius: 999px;
      background: transparent;
      border: 1px solid rgba(0,229,255,0.2);
      box-shadow: 0 0 20px 4px rgba(0,229,255,0.03), 0 0 60px 12px rgba(0,0,0,0.4);
      pointer-events: none; transition: box-shadow 0.6s ease;
    }
    .ki-dish {
      position: relative; width: 100%;
      height: clamp(70px, 10vh, 100px);
      border-radius: 999px; overflow: hidden;
      background: linear-gradient(180deg, rgba(0,229,255,0.02) 0%, rgba(5,5,8,0.9) 40%, rgba(2,2,4,0.95) 100%);
      backdrop-filter: blur(20px) saturate(120%);
      -webkit-backdrop-filter: blur(20px) saturate(120%);
      border: 1px solid rgba(0,229,255,0.1);
      box-shadow: 0 0 0 1px rgba(0,229,255,0.02), inset 0 1px 0 rgba(0,229,255,0.06),
        inset 0 -1px 0 rgba(0,0,0,0.6), inset 0 8px 24px rgba(0,0,0,0.6),
        0 20px 50px rgba(0,0,0,0.5), 0 0 20px rgba(0,0,0,0.5);
    }
    .ki-spec-top {
      position: absolute; top: 0; left: 8%; width: 84%; height: 20px;
      background: linear-gradient(180deg, rgba(0,229,255,0.1) 0%, transparent 100%);
      border-radius: 0 0 50% 50% / 0 0 100% 100%; pointer-events: none; z-index: 10;
    }
    .ki-spec-bot {
      position: absolute; bottom: 4px; left: 15%; width: 70%; height: 10px;
      background: linear-gradient(0deg, rgba(0,229,255,0.03) 0%, transparent 100%);
      border-radius: 50%; pointer-events: none; z-index: 10;
    }
    .ki-rim-l, .ki-rim-r { position: absolute; top: 0; bottom: 0; width: 22px; z-index: 10; pointer-events: none; }
    .ki-rim-l { left: 0; background: linear-gradient(90deg, rgba(0,229,255,0.04), transparent); border-right: 1px solid rgba(0,229,255,0.04); }
    .ki-rim-r { right: 0; background: linear-gradient(270deg, rgba(0,229,255,0.04), transparent); border-left: 1px solid rgba(0,229,255,0.04); }
    #ki-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .ki-tick { position: absolute; width: 10px; height: 10px; border-color: rgba(0,229,255,0.12); border-style: solid; border-width: 0; }
    .ki-tick-tl { top: -14px; left: 10px; border-top-width: 1px; border-left-width: 1px; }
    .ki-tick-tr { top: -14px; right: 10px; border-top-width: 1px; border-right-width: 1px; }
    .ki-tick-bl { bottom: -14px; left: 10px; border-bottom-width: 1px; border-left-width: 1px; }
    .ki-tick-br { bottom: -14px; right: 10px; border-bottom-width: 1px; border-right-width: 1px; }

    .ki-controls { display: flex; align-items: center; gap: 20px; }
    .ki-status-panel { display: flex; align-items: center; gap: 8px; min-width: 90px; }
    .ki-status-dot {
      width: 6px; height: 6px; border-radius: 0;
      background: var(--hud-text-dim); box-shadow: none;
      transition: background 0.4s, box-shadow 0.4s;
    }
    .ki-status-dot.listening { background: var(--hud-cyan); box-shadow: 0 0 8px 2px var(--hud-cyan-glow); animation: kiPulse 1.2s ease-in-out infinite; }
    @keyframes kiPulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.5);opacity:0.7} }
    .ki-status-label {
      font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 400;
      letter-spacing: 0.2em; color: var(--hud-text-dim);
      text-transform: uppercase; transition: color 0.4s;
    }
    .ki-status-label.listening { color: var(--hud-cyan); }

    .ki-readout {
      display: flex; align-items: center; gap: 12px;
      background: rgba(0,229,255,0.02); border: 1px solid var(--hud-border);
      border-radius: 0; padding: 5px 12px; min-width: 100px;
      opacity: 0.6; transition: opacity 0.4s;
    }
    .ki-readout.active { opacity: 1; }
    .ki-readout-val { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 400; color: var(--hud-text); font-variant-numeric: tabular-nums; min-width: 32px; text-align: right; }
    .ki-readout-key { font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 400; letter-spacing: 0.15em; color: var(--hud-text-dim); text-transform: uppercase; }
    .ki-readout-div { width: 1px; height: 16px; background: var(--hud-border); }

    .ki-mic-btn {
      position: relative; min-width: 54px; height: 36px; border-radius: 0;
      border: 1px solid var(--hud-cyan-dim); background: rgba(0,229,255,0.03);
      color: var(--hud-text); cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 0 16px; outline: none; flex-shrink: 0;
      transition: background 0.3s, border-color 0.3s, transform 0.2s, box-shadow 0.3s;
    }
    .ki-mic-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 400; letter-spacing: 0.2em; color: var(--hud-text-dim); white-space: nowrap; }
    .ki-mic-btn:hover { background: rgba(0,229,255,0.06); box-shadow: 0 0 16px rgba(0,229,255,0.1); border-color: var(--hud-cyan-glow); transform: scale(1.02); }
    .ki-mic-btn:active { transform: scale(0.97); }
    .ki-mic-btn.listening { border-color: var(--hud-cyan); background: rgba(0,229,255,0.06); box-shadow: 0 0 20px rgba(0,229,255,0.12); }
    .ki-mic-ring {
      position: absolute; inset: -6px; border-radius: 0;
      border: 1px solid transparent; pointer-events: none;
      transition: border-color 0.3s, transform 0.3s;
    }
    .ki-mic-btn.listening .ki-mic-ring { border-color: var(--hud-cyan-dim); animation: kiMicRing 1.8s ease-out infinite; }
    @keyframes kiMicRing { 0%{transform:scale(1);opacity:1} 100%{transform:scale(1.3);opacity:0} }

    .ki-section.state-listening .ki-glow-ring {
      border-color: rgba(0,229,255,0.35);
      box-shadow: 0 0 30px 8px rgba(0,229,255,0.08), 0 0 80px 20px rgba(0,0,0,0.4);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .message-panels { width: 96%; }
      .message-panel { min-height: 56px; max-height: 80px; padding: 10px 16px; }
      .ki-controls { gap: 12px; }
      .ki-readout { display: none; }
      .ki-mic-label { display: none; }
      .corner-bracket { width: 18px; height: 18px; }
      .watermark { font-size: 16vw; }
      .system-clock { display: none; }
    }
  </style>
</head>

<body>
  <!-- Corner bracket reticles -->
  <div class="corner-bracket tl"></div>
  <div class="corner-bracket tr"></div>
  <div class="corner-bracket bl"></div>
  <div class="corner-bracket br"></div>

  <!-- CLASSIFIED watermark -->
  <div class="watermark">CLASSIFIED</div>

  <!-- System clock -->
  <div class="system-clock" id="systemClock">
    <span class="clock-label">SYS.CLOCK</span>
    <span id="clockTime">--:--:--</span>
  </div>

  <!-- Start overlay — one click to initialize -->
  <div class="start-overlay" id="startOverlay">
    <div class="prompt-ring">
      <span class="prompt-icon">◇</span>
    </div>
    <div class="prompt-text">Initialize System</div>
    <div class="prompt-sub">Authorization Required — Click Anywhere</div>
  </div>

  <!-- Debug: audio file input -->
  <div class="debug-audio" id="debugAudio">
    <span>DBG</span>
    <label for="audioFileInput">Load Audio</label>
    <input type="file" id="audioFileInput" accept="audio/*">
    <span class="debug-status" id="debugStatus">No file</span>
  </div>

  <!-- Connection status HUD -->
  <div class="connection-status" id="connectionStatus">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusLabel">Initializing</span>
  </div>

  <!-- KITE animation (embedded untouched) -->
  <div class="animation-frame">
    <iframe id="kiteFrame" src="kite_breathing.html"></iframe>
  </div>

  <!-- Input Visualizer -->
  <div class="ki-section" id="kiSection">
    <section class="ki-wrapper" aria-label="Input audio visualizer">
      <div class="ki-glow-ring" id="kiGlowRing"></div>
      <div class="ki-dish">
        <div class="ki-spec-top"></div>
        <div class="ki-spec-bot"></div>
        <canvas id="ki-canvas" aria-hidden="true"></canvas>
        <div class="ki-rim-l"></div>
        <div class="ki-rim-r"></div>
      </div>
      <div class="ki-tick ki-tick-tl"></div>
      <div class="ki-tick ki-tick-tr"></div>
      <div class="ki-tick ki-tick-bl"></div>
      <div class="ki-tick ki-tick-br"></div>
    </section>
    <div class="ki-controls">
      <div class="ki-status-panel">
        <div class="ki-status-dot" id="kiStatusDot"></div>
        <span class="ki-status-label" id="kiStatusLabel">IDLE</span>
      </div>
      <div class="ki-readout" id="kiReadout">
        <div style="display:flex;align-items:baseline;gap:4px">
          <span class="ki-readout-val" id="kiFreqVal">—</span>
          <span class="ki-readout-key">Hz</span>
        </div>
        <div class="ki-readout-div"></div>
        <div style="display:flex;align-items:baseline;gap:4px">
          <span class="ki-readout-val" id="kiVolVal">—</span>
          <span class="ki-readout-key">dB</span>
        </div>
      </div>
      <button class="ki-mic-btn" id="kiMicBtn" aria-label="Toggle microphone">
        <span class="ki-mic-ring"></span>
        <span class="ki-mic-label">SPEAK</span>
        <svg id="kiMicIcon" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>
          <path d="M5 11a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="18" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="8" y1="22" x2="16" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <!-- Hidden assistant audio for analyser node -->
    <audio id="kiAssistantAudio" crossorigin="anonymous"></audio>
  </div>

  <!-- Message display panels -->
  <div class="message-panels" id="messagePanels">
    <div class="message-panel" id="userPanel">
      <div class="panel-label user-label">
        <span class="icon">▸</span>
        [ <span class="accent">INPUT</span> ]
      </div>
      <div class="message-text user-text empty" id="userText">Awaiting input…</div>
    </div>
    <div class="message-panel" id="agentPanel">
      <div class="panel-label agent-label">
        <span class="icon">◆</span>
        [ <span class="accent">RESPONSE</span> ]
      </div>
      <div class="message-text agent-text empty" id="agentText">Standby…</div>
    </div>
  </div>

  <script>
    // ── Elements ──
    const kiteFrame = document.getElementById('kiteFrame');
    const startOverlay = document.getElementById('startOverlay');
    const connectionStatus = document.getElementById('connectionStatus');
    const messagePanels = document.getElementById('messagePanels');
    const debugAudioEl = document.getElementById('debugAudio');
    const audioFileInput = document.getElementById('audioFileInput');
    const debugStatus = document.getElementById('debugStatus');
    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const userTextEl = document.getElementById('userText');
    const agentTextEl = document.getElementById('agentText');
    const systemClock = document.getElementById('systemClock');
    const clockTime = document.getElementById('clockTime');

    let lastMessageCount = 0;
    let activated = false;

    // ── Activation: user clicks once to unlock audio + connect ──
    startOverlay.addEventListener('click', () => {
      if (activated) return;
      activated = true;
      startOverlay.classList.add('hidden');

      try {
        const iframeDoc = kiteFrame.contentDocument || kiteFrame.contentWindow.document;
        const connectBtn = iframeDoc.getElementById('connectBtn');
        if (connectBtn) connectBtn.click();
        const controls = iframeDoc.querySelector('.controls');
        if (controls) controls.style.display = 'none';
      } catch (e) { console.warn('Could not access iframe:', e); }

      setTimeout(() => {
        connectionStatus.classList.add('visible');
        debugAudioEl.classList.add('visible');
        systemClock.classList.add('visible');
        statusDot.classList.add('connected');
        statusLabel.textContent = 'Online';
        // Start system clock
        function tickClock() {
          const now = new Date();
          clockTime.textContent = now.toTimeString().slice(0, 8);
        }
        tickClock();
        setInterval(tickClock, 1000);
      }, 300);

      setTimeout(() => {
        messagePanels.classList.add('visible');
        document.getElementById('kiSection').classList.add('visible');
      }, 600);

      pollMessages();
      setInterval(pollMessages, 1000);
    });

    // ── Debug: load audio file directly into iframe's player ──
    audioFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      debugStatus.textContent = `Loaded: ${file.name}`;
      try {
        const iframeDoc = kiteFrame.contentDocument || kiteFrame.contentWindow.document;
        const iframeAudioPlayer = iframeDoc.getElementById('audioPlayer');
        if (iframeAudioPlayer) {
          const url = URL.createObjectURL(file);
          iframeAudioPlayer.src = url;
          iframeAudioPlayer.play().then(() => {
            debugStatus.textContent = `Playing: ${file.name}`;
          }).catch(err => {
            debugStatus.textContent = `Play failed: ${err.message}`;
          });
        } else {
          debugStatus.textContent = 'Error: audioPlayer not found in iframe';
        }
      } catch (err) {
        debugStatus.textContent = `Error: ${err.message}`;
      }
    });

    // ── Poll for messages ──
    async function pollMessages() {
      try {
        const response = await fetch('/api/messages');
        if (!response.ok) throw new Error('API error');
        const data = await response.json();
        const messages = data.messages || [];
        if (messages.length !== lastMessageCount) {
          let latestUser = null, latestAgent = null;
          for (let i = messages.length - 1; i >= 0; i--) {
            if (!latestUser && messages[i].role === 'user') latestUser = messages[i];
            if (!latestAgent && messages[i].role === 'agent') latestAgent = messages[i];
            if (latestUser && latestAgent) break;
          }
          if (latestUser) {
            userTextEl.textContent = latestUser.text;
            userTextEl.classList.remove('empty'); userTextEl.classList.add('fresh');
            setTimeout(() => userTextEl.classList.remove('fresh'), 3000);
          }
          if (latestAgent) {
            agentTextEl.textContent = latestAgent.text;
            agentTextEl.classList.remove('empty'); agentTextEl.classList.add('fresh');
            setTimeout(() => agentTextEl.classList.remove('fresh'), 3000);
          }
          statusDot.classList.add('connected'); statusDot.classList.remove('error');
          statusLabel.textContent = 'Connected';
          lastMessageCount = messages.length;
        }
      } catch (err) {
        statusDot.classList.remove('connected');
        statusDot.classList.add('error');
        statusLabel.textContent = 'Offline';
      }
    }

    // =====================================================================
    // INPUT FLUID VISUALIZER ENGINE
    // =====================================================================
    const KI_CFG = {
      NUM_POINTS: 180, DAMPENING: 0.970, SPREAD: 0.2, SPREAD_ITERS: 6,
      SPRING_K: 0.022, MAX_VEL: 28, MAX_HEIGHT: 38,
      REFLECT_COEFF: 0.52,
      IDLE_AMP: 2.8, IDLE_SPEED: 0.28, IDLE_FREQ: 2.4,
      SENSITIVITY_MULTIPLIER: 2.5, NOISE_GATE: 0.018,
      MIC_FORCE_SCALE: 28, MIC_SPLASH_WIDTH: 32, MIC_IMPULSE_RATE: 0.38,
      BASS_FORCE_SCALE: 25, BASS_CONE_WIDTH: 60, BASS_THRESHOLD: 0.12,
      HF_FORCE_SCALE: 22, HF_SPLASH_WIDTH: 4, HF_THRESHOLD: 0.15,
      LERP_ALPHA: 0.14, VOL_THRESHOLD: 0.008,
      FLUID_FILL_LOW: 0.52, FLUID_FILL_HIGH: 0.66,
      TARGET_FPS: 60,
    };

    // ── WaterSurface ──
    class KiWaterSurface {
      constructor(n) {
        this.n = n;
        this.h = new Float32Array(n);
        this.vel = new Float32Array(n);
        this.lD = new Float32Array(n);
        this.rD = new Float32Array(n);
      }
      splash(idx, force, width = 14) {
        const half = width / 2;
        for (let i = Math.max(0, idx - half | 0); i < Math.min(this.n, idx + half | 0); i++) {
          const d = Math.abs(i - idx);
          this.vel[i] += force * Math.exp(-(d * d) / (2 * (half * 0.45) ** 2));
        }
      }
      applyIdleWave(t, amp = KI_CFG.IDLE_AMP) {
        for (let i = 0; i < this.n; i++) {
          const phase = (i / this.n) * KI_CFG.IDLE_FREQ * Math.PI * 2;
          const target = Math.sin(phase - t * KI_CFG.IDLE_SPEED) * amp;
          this.vel[i] += (target - this.h[i]) * 0.004;
        }
      }
      conePush(force, halfWidth) {
        const c = this.n / 2, lo = Math.max(0, c - halfWidth | 0), hi = Math.min(this.n, c + halfWidth | 0);
        for (let i = lo; i < hi; i++) {
          const norm = (i - lo) / (hi - lo);
          this.vel[i] += -force * Math.cos((norm - 0.5) * Math.PI);
        }
      }
      update() {
        const { n, h, vel, lD, rD } = this;
        for (let p = 0; p < KI_CFG.SPREAD_ITERS; p++) {
          for (let i = 0; i < n; i++) {
            if (i > 0) { lD[i] = KI_CFG.SPREAD * (h[i] - h[i - 1]); vel[i - 1] += lD[i]; }
            if (i < n - 1) { rD[i] = KI_CFG.SPREAD * (h[i] - h[i + 1]); vel[i + 1] += rD[i]; }
          }
          for (let i = 0; i < n; i++) {
            if (i > 0) h[i - 1] += lD[i];
            if (i < n - 1) h[i + 1] += rD[i];
          }
        }
        vel[1] -= KI_CFG.REFLECT_COEFF * vel[0]; vel[n - 2] -= KI_CFG.REFLECT_COEFF * vel[n - 1];
        vel[0] = 0; vel[n - 1] = 0;
        for (let i = 0; i < n; i++) {
          vel[i] += -h[i] * KI_CFG.SPRING_K;
          vel[i] *= KI_CFG.DAMPENING;
          vel[i] = Math.max(-KI_CFG.MAX_VEL, Math.min(KI_CFG.MAX_VEL, vel[i]));
          h[i] += vel[i];
          h[i] = Math.max(-KI_CFG.MAX_HEIGHT, Math.min(KI_CFG.MAX_HEIGHT, h[i]));
        }
      }
    }

    // ── FluidRenderer ──
    class KiFluidRenderer {
      constructor(canvas) {
        this.canvas = canvas; this.ctx = canvas.getContext('2d');
        this.width = 0; this.height = 0; this.baseY = 0; this.colorPhase = 0;
        this.resize();
      }
      resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const rect = this.canvas.getBoundingClientRect();
        this.width = rect.width * dpr; this.height = rect.height * dpr;
        this.canvas.width = this.width; this.canvas.height = this.height;
        this.ctx.scale(dpr, dpr);
        this.logW = rect.width; this.logH = rect.height;
        this.baseY = this.logH * KI_CFG.FLUID_FILL_LOW;
      }
      draw(heights, audioState, t) {
        const { ctx, logW, logH } = this;
        const n = heights.length, step = logW / (n - 1);
        const bass = audioState.bassEnergy || 0;
        this.colorPhase += bass * 0.6;
        const vol = audioState.volume || 0;
        const restY = this.baseY - vol * logH * 0.22;
        ctx.clearRect(0, 0, logW, logH);
        // Scan lines
        ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.018)'; ctx.lineWidth = 0.5;
        for (let y = 0; y < logH; y += 4) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(logW, y); ctx.stroke(); }
        ctx.restore();
        // Surface path + fill
        ctx.beginPath(); ctx.moveTo(0, restY + heights[0]);
        for (let i = 0; i < n - 1; i++) {
          const x0 = i * step, y0 = restY + heights[i], x1 = (i + 1) * step, y1 = restY + heights[i + 1];
          ctx.quadraticCurveTo(x0, y0, (x0 + x1) / 2, (y0 + y1) / 2);
        }
        ctx.lineTo(logW, restY + heights[n - 1]); ctx.lineTo(logW, logH + 4); ctx.lineTo(0, logH + 4); ctx.closePath();
        const ls = Math.sin(this.colorPhase * 0.05) * 8;
        const tL = Math.round(255 + ls), mL = Math.round(161 + ls * 0.6), dL = Math.round(64 + ls * 0.3);
        const grd = ctx.createLinearGradient(0, restY - 20, 0, logH);
        grd.addColorStop(0, `rgba(${tL},${tL},${tL},0.55)`);
        grd.addColorStop(0.05, `rgba(${tL},${tL},${tL},0.80)`);
        grd.addColorStop(0.30, `rgba(${mL},${mL},${mL},0.90)`);
        grd.addColorStop(0.65, `rgba(${dL},${dL},${dL},0.97)`);
        grd.addColorStop(1, 'rgba(0,0,0,1)');
        ctx.fillStyle = grd; ctx.fill();
        // Waterline glow
        ctx.save();
        const drawLine = () => { ctx.beginPath(); ctx.moveTo(0, restY + heights[0]);
          for (let i = 0; i < n - 1; i++) { const x0 = i * step, y0 = restY + heights[i], x1 = (i + 1) * step, y1 = restY + heights[i + 1]; ctx.quadraticCurveTo(x0, y0, (x0 + x1) / 2, (y0 + y1) / 2); }
          ctx.lineTo(logW, restY + heights[n - 1]); };
        drawLine(); ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 10; ctx.shadowColor = 'rgba(255,255,255,0.6)'; ctx.shadowBlur = 18; ctx.stroke();
        drawLine(); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5; ctx.shadowBlur = 8; ctx.stroke();
        ctx.restore();
        // Caustics
        if (vol > 0.015) {
          ctx.save(); const cy = restY + (logH - restY) * 0.35; const a = Math.min(vol * 2.5, 0.18);
          for (let i = 0; i < 6; i++) {
            const x = (logW * (i + 0.5) / 6) + Math.sin(t * 1.8 + i * 1.3) * 20;
            const y = cy + Math.cos(t * 2.2 + i * 0.9) * 14;
            const r = 18 + Math.sin(t * 3 + i) * 8;
            const g = ctx.createRadialGradient(x, y, 0, x, y, r);
            g.addColorStop(0, `rgba(200,200,200,${a})`); g.addColorStop(1, 'rgba(200,200,200,0)');
            ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.5, 0, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
        }
      }
    }

    // ── AudioEngine (mic only for input) ──
    class KiAudioEngine {
      constructor() {
        this.ctx = null; this.micAnalyser = null; this.micBuf = null; this.micFreqBuf = null;
        this.micStream = null; this.micVolume = 0; this.micPitch = 0; this.micBass = 0; this.micHF = 0;
        this.micActive = false;
      }
      async initContext() {
        if (this.ctx) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') await this.ctx.resume();
      }
      async initMic() {
        await this.initContext();
        if (this.micActive) return;
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        this.micStream = stream;
        const src = this.ctx.createMediaStreamSource(stream);
        this.micAnalyser = this.ctx.createAnalyser();
        this.micAnalyser.fftSize = 2048; this.micAnalyser.smoothingTimeConstant = 0.8;
        src.connect(this.micAnalyser);
        this.micBuf = new Float32Array(this.micAnalyser.fftSize);
        this.micFreqBuf = new Float32Array(this.micAnalyser.frequencyBinCount);
        this.micActive = true;
      }
      stopMic() {
        if (this.micStream) { this.micStream.getTracks().forEach(t => t.stop()); this.micStream = null; }
        this.micActive = false;
      }
      lerp(c, t, a) { return c + (t - c) * a; }
      getRMS(buf) { let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i]; return Math.sqrt(s / buf.length); }
      getDominantHz(fb, an) {
        if (!an) return 0;
        let mx = -Infinity, mi = 0;
        const bHz = this.ctx.sampleRate / an.fftSize;
        const lo = Math.floor(80 / bHz), hi = Math.ceil(4000 / bHz);
        for (let i = lo; i <= Math.min(hi, fb.length - 1); i++) { if (fb[i] > mx) { mx = fb[i]; mi = i; } }
        return mi * bHz;
      }
      getBassEnergy(fb, an) {
        if (!an) return 0;
        const bHz = this.ctx.sampleRate / an.fftSize;
        const lo = Math.floor(20 / bHz), hi = Math.ceil(250 / bHz);
        let s = 0;
        for (let i = lo; i <= Math.min(hi, fb.length - 1); i++) s += Math.pow(10, fb[i] / 20);
        return Math.min(s / (hi - lo + 1) / 3, 1);
      }
      getHFEnergy(fb, an) {
        if (!an) return 0;
        const bHz = this.ctx.sampleRate / an.fftSize;
        const lo = Math.floor(3000 / bHz), hi = Math.ceil(10000 / bHz);
        let s = 0;
        for (let i = lo; i <= Math.min(hi, fb.length - 1); i++) s += Math.pow(10, fb[i] / 20);
        return Math.min(s / (hi - lo + 1) / 2.5, 1);
      }
      tick() {
        const a = KI_CFG.LERP_ALPHA, mul = KI_CFG.SENSITIVITY_MULTIPLIER;
        if (this.micActive && this.micAnalyser) {
          this.micAnalyser.getFloatTimeDomainData(this.micBuf);
          this.micAnalyser.getFloatFrequencyData(this.micFreqBuf);
          const amp = this.getRMS(this.micBuf) * mul;
          const gv = amp > KI_CFG.NOISE_GATE ? amp : 0;
          this.micVolume = this.lerp(this.micVolume, gv, a);
          this.micPitch = this.lerp(this.micPitch, this.getDominantHz(this.micFreqBuf, this.micAnalyser), a * 0.5);
          this.micBass = this.lerp(this.micBass, this.getBassEnergy(this.micFreqBuf, this.micAnalyser), a * 0.7);
          this.micHF = this.lerp(this.micHF, this.getHFEnergy(this.micFreqBuf, this.micAnalyser), a * 0.8);
        } else {
          this.micVolume = this.lerp(this.micVolume, 0, a);
          this.micPitch = this.lerp(this.micPitch, 0, a);
          this.micBass = this.lerp(this.micBass, 0, a);
          this.micHF = this.lerp(this.micHF, 0, a);
        }
      }
    }

    // ── InputVoiceUI state machine ──
    const KI_STATE = { IDLE: 'idle', LISTENING: 'listening' };

    class InputVoiceUI {
      constructor() {
        this.canvas = document.getElementById('ki-canvas');
        this.micBtn = document.getElementById('kiMicBtn');
        this.statusLabelEl = document.getElementById('kiStatusLabel');
        this.statusDotEl = document.getElementById('kiStatusDot');
        this.freqVal = document.getElementById('kiFreqVal');
        this.volVal = document.getElementById('kiVolVal');
        this.readoutPanel = document.getElementById('kiReadout');
        this.sectionEl = document.getElementById('kiSection');

        this.surface = new KiWaterSurface(KI_CFG.NUM_POINTS);
        this.renderer = new KiFluidRenderer(this.canvas);
        this.audio = new KiAudioEngine();

        this.state = KI_STATE.IDLE;
        this.t = 0; this.lastTime = null;
        this.frameInterval = 1000 / KI_CFG.TARGET_FPS;
        this.lastFrameTime = 0;

        this._bindEvents();
        this._setState(KI_STATE.IDLE);
        this._startLoop();
      }

      _bindEvents() {
        this.micBtn.addEventListener('click', async () => {
          if (this.state === KI_STATE.IDLE) {
            await this._startListening();
          } else {
            this._stopListening();
          }
        });
        window.addEventListener('resize', () => this.renderer.resize());
      }

      async _startListening() {
        try {
          await this.audio.initMic();
          this._setState(KI_STATE.LISTENING);
          // Notify backend
          try {
            await fetch('/api/listen_toggle', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ state: true })
            });
          } catch (e) { console.warn('Backend listen_toggle failed:', e); }
        } catch (err) {
          console.warn('Microphone access denied:', err.message);
        }
      }

      _stopListening() {
        this.audio.stopMic();
        this._setState(KI_STATE.IDLE);
        // Notify backend
        fetch('/api/listen_toggle', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ state: false })
        }).catch(e => console.warn('Backend listen_toggle failed:', e));
      }

      _setState(newState) {
        this.state = newState;
        const sec = this.sectionEl;
        sec.classList.remove('state-idle', 'state-listening');
        sec.classList.add(`state-${newState}`);
        this.statusDotEl.className = `ki-status-dot ${newState}`;
        this.statusLabelEl.className = `ki-status-label ${newState}`;
        this.statusLabelEl.textContent = newState.toUpperCase();
        this.micBtn.className = `ki-mic-btn ${newState}`;
        if (newState === KI_STATE.IDLE) {
          this.readoutPanel.classList.remove('active');
          this.freqVal.textContent = '—'; this.volVal.textContent = '—';
        } else {
          this.readoutPanel.classList.add('active');
        }
      }

      _updatePhysics() {
        const { surface, audio, state } = this;
        surface.update();
        if (state === KI_STATE.IDLE) {
          surface.applyIdleWave(this.t);
        } else {
          surface.applyIdleWave(this.t, KI_CFG.IDLE_AMP * 0.5);
          const vol = audio.micVolume, bass = audio.micBass, hf = audio.micHF;
          if (vol > KI_CFG.NOISE_GATE) {
            if (bass > KI_CFG.BASS_THRESHOLD) surface.conePush(bass * KI_CFG.BASS_FORCE_SCALE * vol, KI_CFG.BASS_CONE_WIDTH);
            if (hf > KI_CFG.HF_THRESHOLD) {
              const ns = 1 + (Math.random() < hf * 0.8 ? 1 : 0);
              for (let s = 0; s < ns; s++) {
                const c = KI_CFG.NUM_POINTS / 2;
                const pos = (c + (Math.random() - 0.5) * KI_CFG.NUM_POINTS * 0.4) | 0;
                surface.splash(pos, -(hf * KI_CFG.HF_FORCE_SCALE), KI_CFG.HF_SPLASH_WIDTH);
              }
            }
            const prob = KI_CFG.MIC_IMPULSE_RATE * (1 + vol * 8);
            if (Math.random() < prob) {
              const pos = Math.random() * KI_CFG.NUM_POINTS | 0;
              const force = vol * KI_CFG.MIC_FORCE_SCALE * (0.5 + Math.random() * 0.5);
              const pitchN = Math.min(audio.micPitch / 1200, 1);
              const width = KI_CFG.MIC_SPLASH_WIDTH * (1 - pitchN * 0.6);
              surface.splash(pos, -force, width | 0);
            }
          }
        }
      }

      _updateReadout() {
        if (this.state === KI_STATE.IDLE) return;
        const vol = this.audio.micVolume, pitch = this.audio.micPitch;
        const dB = vol > 0 ? Math.round(20 * Math.log10(vol)) : -80;
        this.volVal.textContent = dB > -80 ? `${dB}` : '—';
        this.freqVal.textContent = pitch > 50 ? `${Math.round(pitch)}` : '—';
      }

      _startLoop() {
        const loop = (ts) => {
          requestAnimationFrame(loop);
          const elapsed = ts - this.lastFrameTime;
          if (elapsed < this.frameInterval - 1) return;
          this.lastFrameTime = ts - (elapsed % this.frameInterval);
          if (!this.lastTime) this.lastTime = ts;
          const dt = Math.min((ts - this.lastTime) / 1000, 0.05);
          this.lastTime = ts; this.t += dt;
          this.audio.tick();
          this._updatePhysics();
          this._updateReadout();
          this.renderer.draw(this.surface.h, { volume: this.audio.micVolume, pitch: this.audio.micPitch, bassEnergy: this.audio.micBass, state: this.state }, this.t);
        };
        requestAnimationFrame(loop);
      }
    }

    // ── Init Input Visualizer on DOM ready ──
    window.addEventListener('DOMContentLoaded', () => {
      window.__kiUI = new InputVoiceUI();
    });

  </script>
  <!-- GSAP for smooth transitions -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"

    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
